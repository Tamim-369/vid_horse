[project]
name = "videoai-new"
version = "0.1.0"
description = "AI video making automation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "av<19",
    "chatterbox-tts>=0.1.7",
    "ddgs>=9.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.27",
    "num2words>=0.5.14",
    "ollama>=0.4",
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
videoai = "cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/config",
    "src/providers",
    "src/blocks",
    "src/pipeline",
    "src/cli",
    "src/utils",
    "src/catalog",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["core", "config", "providers", "blocks", "pipeline", "cli", "utils", "catalog", "tests", "experiments"]

[tool.ruff.lint.per-file-ignores]
"src/cli/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits an external service; enable with VIDEOAI_LIVE_TESTS=1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
chatterbox-tts = { git = "https://github.com/resemble-ai/chatterbox" }
