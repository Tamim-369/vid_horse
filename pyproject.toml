[project]
name = "videoai-new"
version = "0.1.0"
description = "AI video making automation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
videoai = "cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/config",
    "src/providers",
    "src/blocks",
    "src/pipeline",
    "src/cli",
    "src/utils",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
